# ============================================================================
# Linear Hall experiment configuration (schema version 1)
#
# This base-case copy is also used to verify whether the checked-in mesh can be
# reused. The public example lives in experiments/linear-hall.yaml. In the
# container, prepare it with:
#
#     mhd prepare /experiments/linear-hall.yaml
#
# ============================================================================

schema_version: 1

channel:
  length: 0.200            # m  (200 mm)
  height: 0.050            # m  ( 50 mm)
  width:  0.050            # m  ( 50 mm)
  wall_thickness: 0.005    # m  (  5 mm insulator / electrode shell)

mesh:
  type: tetrahedral         # or structured (graded hexahedra, see MHD.md)
  size_min: null            # global minimum edge length (null = Gmsh default)
  size_max: null            # global maximum edge length
  size_factor: 0.2          # >1 coarser, <1 finer

# ---------------------------------------------------------------------------
# Electrode pairs — two supported formats:
#
#   Format A – explicit pair placement and resistance:
#     electrodes:
#       length: 0.010
#       pairs:
#         - { x_center: 0.040, resistance: 1.0 }
#         - { x_center: 0.120, resistance: 1.0 }
#
#   Format B – auto-spaced (evenly distributed along the channel):
#     electrodes:
#       count: 4
#       length: 0.010
#       resistance: 1.0
#
# Exactly one of "pairs" and "count" must be supplied. All pairs use the one
# shared electrode length. Pair-specific resistances are supported.
# ---------------------------------------------------------------------------
electrodes:
  length: 0.010
  pairs:
    - { x_center: 0.040, resistance: 1.0 }
    - { x_center: 0.080, resistance: 1.0 }
    - { x_center: 0.120, resistance: 1.0 }
    - { x_center: 0.160, resistance: 1.0 }

physics:
  B_field: [0, 0, 1.5]
  inlet_velocity: [391, 0, 0]
  inlet_temperature: 1500
  insulator_wall_temperature: 300   # K, fixed wall temperature; null = adiabatic
  electrode_wall_temperature: 300   # K
  outlet_pressure: 101325          # Pa, absolute

# ---------------------------------------------------------------------------
# Seeded plasma (optional; defaults shown). Only the alkali seed ionizes,
# via the Saha equation at the electron temperature; the carrier gas stays
# neutral. Conductivity uses electron-neutral collisions with carrier and
# seed. With two_temperature, Te rises above Tgas where Joule heating of the
# electrons exceeds their collisional losses (Kerrebrock).
# ---------------------------------------------------------------------------
plasma:
  seed_mole_fraction: 0.01        # potassium atoms per heavy particle
  # Electron collisions from plasma_collisions (Maxwellian EEDF): drifting
  # (collision frequencies add; lower bound on sigma) or lorentz (upper bound)
  electron_transport_model: drifting
  potassium_elastic_scale: 1.0     # e-K momentum cross section multiplier (+-30%)
  # electron: K(4p) follows the electrons (no net inelastic loss); gas: quenched
  excited_state_temperature: electron
  ion_reduced_mobility: 2.43e-4    # m^2/(V s) at 2.6868e25 m^-3 (K+ in Ar, Langevin); ion slip
  sigma_min: 1.0e-2               # S/m
  sigma_max: 1.0e6                # S/m
  two_temperature: true           # Te from Joule heating vs. collisional loss
  electron_energy_transport: true # Te from the electron energy equation (false: local balance)
  electron_temperature_max: 20000 # K
  electron_temperature_relaxation: 0.5

# How often Elmer re-solves the electrical problem. Updates happen when U, T or
# p has changed by more than these relative tolerances since the last update;
# all zero updates every step. Check "change since last update" in the log.
coupling:
  velocity_tolerance: 0.05
  temperature_tolerance: 0.005    # sigma is exponential in T: keep this tight
  pressure_tolerance: 0.05
  max_steps_between_updates: 250
