# Baseline linear Hall MHD experiment.
schema_version: 1

channel:
  length: 0.200
  height: 0.050
  width: 0.050
  wall_thickness: 0.005

mesh:
  size_min: null
  size_max: null
  size_factor: 0.1

electrodes:
  length: 0.010
  pairs:
    - { x_center: 0.040, resistance: 1.0 }
    - { x_center: 0.080, resistance: 1.0 }
    - { x_center: 0.120, resistance: 1.0 }
    - { x_center: 0.160, resistance: 1.0 }

physics:
  B_field: [0, 0, 1.5]
  inlet_velocity: [391, 0, 0]
  inlet_temperature: 2500

# Alkali-seeded argon. Only the seed ionizes (two-temperature Saha).
plasma:
  seed_mole_fraction: 0.01        # potassium atoms per heavy particle
  seed_ionization_energy: 4.3407  # eV
  seed_gi_over_gn: 0.5            # g(K+) / g(K)
  seed_cross_section: 4.0e-18     # m^2, electron-K momentum transfer
  carrier_cross_section: 3.93994730526347e-21  # m^2, electron-Ar momentum transfer
  reference_pressure: 101325      # Pa, absolute pressure at OpenFOAM p = 0
  sigma_min: 1.0e-2               # S/m
  sigma_max: 1.0e6                # S/m
  two_temperature: true           # Te from Joule heating vs. collisional loss
  carrier_molar_mass: 39.948      # g/mol (Ar)
  seed_molar_mass: 39.098         # g/mol (K)
  energy_loss_factor: 1.0         # delta; 1 = elastic losses only (monatomic)
  electron_temperature_max: 20000 # K
  electron_temperature_relaxation: 0.5

# How often Elmer re-solves the electrical problem. Updates happen when U, T or
# p has changed by more than these relative tolerances since the last update;
# all zero updates every step. Check "change since last update" in the log.
coupling:
  velocity_tolerance: 0.05
  temperature_tolerance: 0.005    # sigma is exponential in T: keep this tight
  pressure_tolerance: 0.05
  max_steps_between_updates: 250
