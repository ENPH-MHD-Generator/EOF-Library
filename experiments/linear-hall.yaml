# Baseline linear Hall MHD experiment.
schema_version: 1

channel:
  length: 0.200
  height: 0.050
  width: 0.050
  wall_thickness: 0.005

mesh:
  type: tetrahedral
  size_min: null
  size_max: null
  size_factor: 0.125
  # Graded hexahedra resolving the cold wall layer on the electrode walls
  # (needs the electron energy equation or two_temperature: false; see MHD.md):
  #   type: structured
  #   electrode_wall_cell_size: 1.5e-5  # m, first cell on the electrode walls
  #   wall_cell_size: 0.0005            # m, first cell on the side walls
  #   cell_size: 0.003                  # m, core, across the channel
  #   streamwise_cell_size: 0.005       # m, core, along the channel
  #   electrode_edge_cell_size: 0.0005  # m, streamwise at electrode edges
  #   growth_rate: 1.2

electrodes:
  length: 0.010
  pairs:
    - { x_center: 0.040, resistance: 1.0 }
    - { x_center: 0.080, resistance: 1.0 }
    - { x_center: 0.120, resistance: 1.0 }
    - { x_center: 0.160, resistance: 1.0 }

physics:
  B_field: [0, 0, 1.5]
  inlet_velocity: [391, 0, 0]
  inlet_temperature: 2500
  # Uncooled walls starting at room temperature; null makes a surface adiabatic
  insulator_wall_temperature: 300   # K
  electrode_wall_temperature: 300   # K
  outlet_pressure: 101325          # Pa, absolute

# Alkali-seeded argon. Only the seed ionizes (two-temperature Saha).
plasma:
  seed_mole_fraction: 0.01        # potassium atoms per heavy particle
  # Electron collisions from plasma_collisions (Maxwellian EEDF): drifting
  # (collision frequencies add; lower bound on sigma) or lorentz (upper bound)
  electron_transport_model: drifting
  potassium_elastic_scale: 1.0     # e-K momentum cross section multiplier (+-30%)
  # electron: K(4p) follows the electrons (no net inelastic loss); gas: quenched
  excited_state_temperature: electron
  ion_reduced_mobility: 2.43e-4    # m^2/(V s) at 2.6868e25 m^-3 (K+ in Ar, Langevin); ion slip
  electron_wall_heat_transmission: 0.0  # sheath energy loss at walls (6.7 floating K+); 0 = adiabatic
  sigma_min: 1.0e-2               # S/m
  sigma_max: 1.0e6                # S/m
  two_temperature: true           # Te from Joule heating vs. collisional loss
  electron_energy_transport: true # Te from the electron energy equation (false: local balance)
  electron_temperature_max: 20000 # K
  electron_temperature_relaxation: 0.5

# How often Elmer re-solves the electrical problem. Updates happen when U, T or
# p has changed by more than these relative tolerances since the last update;
# all zero updates every step. Check "change since last update" in the log.
coupling:
  velocity_tolerance: 0.05
  temperature_tolerance: 0.005    # sigma is exponential in T: keep this tight
  pressure_tolerance: 0.05
  max_steps_between_updates: 250
